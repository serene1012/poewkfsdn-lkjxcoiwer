<!doctype html>
<html lang="vi"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6B4FBF">
<title>Lò Luyện Python</title>
<link rel="icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  --bg:#F6F3FB; --panel:#FFFFFF; --ink:#1E1A2E; --muted:#625B78; --line:#DDD5EC;
  --accent:#6B4FBF; --accent-dk:#4E378F; --accent-ink:#FFFFFF; --accent-soft:#ECE6FA;
  --target:#FFF1C2; --good:#1E8A55; --good-dk:#15653E; --good-soft:#DFF3E8; --bad:#C8413A; --bad-soft:#FBE3E0;
  --head:#F1ECF9; --code:#F7F5FC; --shadow:rgba(40,20,90,.18); --scrim:rgba(20,10,40,.5);
  --cf1:#6B4FBF; --cf2:#A98BFF; --cf3:#E8B923; --cf4:#1E8A55; --cf5:#E2574C;
  --f-body:"Be Vietnam Pro",system-ui,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#13111C; --panel:#1C1929; --ink:#ECE8F5; --muted:#A49DB8; --line:#332E46;
  --accent:#A98BFF; --accent-dk:#7A5FD6; --accent-ink:#160F2A; --accent-soft:#2A2342;
  --target:#3A3214; --good:#5CD49A; --good-dk:#2F9A66; --good-soft:#16291F; --bad:#FF8277; --bad-soft:#3A1C1A;
  --head:#241F35; --code:#171422; --shadow:rgba(0,0,0,.5); --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13111C; --panel:#1C1929; --ink:#ECE8F5; --muted:#A49DB8; --line:#332E46;
  --accent:#A98BFF; --accent-dk:#7A5FD6; --accent-ink:#160F2A; --accent-soft:#2A2342;
  --target:#3A3214; --good:#5CD49A; --good-dk:#2F9A66; --good-soft:#16291F; --bad:#FF8277; --bad-soft:#3A1C1A;
  --head:#241F35; --code:#171422; --shadow:rgba(0,0,0,.5); --scrim:rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;
  background-image:radial-gradient(color-mix(in srgb,var(--accent) 6%,transparent) 1.2px,transparent 1.4px);background-size:22px 22px;
  padding:max(12px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 110px max(16px,env(safe-area-inset-left))}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.brand h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.02em}
.brand h1 span{color:var(--accent)}
.tools{display:flex;gap:6px}
.ib{all:unset;cursor:pointer;width:40px;height:40px;display:grid;place-items:center;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
.ib:hover{background:var(--head)}.ib:focus-visible{outline:2px solid var(--accent)}
.ib[aria-pressed=true]{border-color:var(--accent);color:var(--accent)}
.stats{display:flex;gap:10px;align-items:center;flex-wrap:wrap;width:100%}
.lvl{flex:1;min-width:180px;display:flex;flex-direction:column;gap:4px}
.lvl b{font-size:14px}.lvl small{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.bar{height:9px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .5s}
.chip{font-family:var(--f-mono);font-size:14px;padding:6px 10px;border:1px solid var(--line);border-radius:9px;background:var(--panel);font-variant-numeric:tabular-nums;display:inline-flex;gap:5px;align-items:center}
.tabs{display:flex;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:5px}
.tabs button{all:unset;flex:1;white-space:nowrap;text-align:center;cursor:pointer;padding:9px 6px;border-radius:9px;font-weight:600;font-size:15px}
.tabs button.on{background:var(--accent-soft);color:var(--accent)}
.tabs button:focus-visible{outline:2px solid var(--accent)}
.hero{display:flex;gap:10px;align-items:flex-end}
.hero img{width:76px;height:76px;flex-shrink:0}
.bub{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:9px 13px;font-size:15px;margin-bottom:10px}
.bub::before{content:"";position:absolute;left:-7px;bottom:12px;width:12px;height:12px;background:var(--panel);border-left:1px solid var(--line);border-bottom:1px solid var(--line);transform:rotate(45deg)}
nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
nav button{all:unset;cursor:pointer;flex-shrink:0;display:flex;gap:7px;align-items:center;padding:8px 12px;border-radius:99px;border:1px solid var(--line);background:var(--panel);font-size:14px;white-space:nowrap}
nav button.on{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
nav button:focus-visible{outline:2px solid var(--accent)}
nav .n{font-family:var(--f-mono);font-size:12px;width:22px;height:22px;display:grid;place-items:center;border-radius:50%;border:1px solid var(--line);color:var(--muted)}
nav .full .n{background:var(--good);border-color:var(--good);color:var(--accent-ink)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;min-width:0;
  box-shadow:0 0 0 3px var(--panel),0 0 0 4px var(--line)}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
h2{margin:2px 0 10px;font-size:21px;font-weight:800;letter-spacing:-.01em;padding-bottom:4px;border-bottom:3px double var(--line)}
details.th summary{cursor:pointer;font-weight:600;color:var(--accent)}
.th p{margin:8px 0}.th ul{margin:6px 0;padding-left:22px}
code{font-family:var(--f-mono);font-size:.88em;background:var(--head);padding:1px 5px;border-radius:5px}
pre{font-family:var(--f-mono);font-size:14px;background:var(--code);border:1px solid var(--line);border-radius:10px;padding:10px 12px;overflow-x:auto;margin:8px 0;line-height:1.5}
pre code{background:none;padding:0;font-size:inherit}
.task{display:flex;flex-direction:column;gap:12px}
.ask{margin:0;font-size:16px}
.steps{display:flex;gap:5px;flex-wrap:wrap}
.steps i{width:22px;height:6px;border-radius:99px;background:var(--line)}
.steps i.ok{background:var(--good)}.steps i.now{background:var(--accent)}
.ed{display:flex;flex-direction:column;border:2px solid var(--line);border-radius:12px;overflow:hidden;background:var(--code)}
.ed:focus-within{border-color:var(--accent)}
.ed textarea{width:100%;min-height:200px;border:0;outline:0;resize:vertical;background:transparent;color:var(--ink);font:15px/1.55 var(--f-mono);padding:10px 12px;tab-size:4;white-space:pre;overflow-x:auto}
.keys{display:flex;gap:5px;overflow-x:auto;padding:6px;border-top:1px solid var(--line);background:var(--head)}
.keys button{all:unset;cursor:pointer;flex-shrink:0;font:600 14px var(--f-mono);min-width:34px;text-align:center;padding:7px 9px;border-radius:8px;background:var(--panel);border:1px solid var(--line)}
.keys button:active{background:var(--accent-soft)}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{font:inherit;font-weight:700;font-size:15px;border-radius:12px;padding:10px 16px;cursor:pointer;border:2px solid var(--line);background:transparent;color:var(--ink);display:inline-flex;gap:7px;align-items:center;box-shadow:0 3px 0 var(--line);transition:transform .05s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);box-shadow:0 3px 0 var(--accent-dk)}
.btn.go{background:var(--good);color:var(--accent-ink);border-color:var(--good);box-shadow:0 3px 0 var(--good-dk)}
.btn:disabled{opacity:.55;cursor:default}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.out{font-family:var(--f-mono);font-size:14px;background:var(--code);border:1px solid var(--line);border-radius:10px;padding:10px 12px;white-space:pre-wrap;overflow-wrap:anywhere;max-height:260px;overflow:auto;margin:0}
.out .lab{display:block;font-family:var(--f-body);font-size:12px;color:var(--muted);font-weight:600;margin-bottom:4px}
.fb{position:relative;border-radius:12px;padding:12px 14px;font-size:15px}
.fb.good{background:var(--good-soft)}.fb.bad{background:var(--bad-soft)}.fb.tip{background:var(--target)}
.fb[data-stamp]::after{content:attr(data-stamp);position:absolute;right:12px;top:-12px;font:800 15px var(--f-body);padding:2px 10px;border:2.5px solid currentColor;border-radius:8px;transform:rotate(-8deg);background:var(--panel)}
.fb.good[data-stamp]::after{color:var(--good)}.fb.bad[data-stamp]::after{color:var(--bad)}
.fb .why{display:block;margin-top:6px}
.fb pre{margin:8px 0 4px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{font:inherit;text-align:left;cursor:pointer;border:2px solid var(--line);background:var(--panel);color:var(--ink);border-radius:12px;padding:11px 14px;display:grid;grid-template-columns:24px 1fr;gap:10px;box-shadow:0 3px 0 var(--line)}
.opt .k{font-family:var(--f-mono);font-weight:700;color:var(--muted)}
.opt.no{border-color:var(--bad);background:var(--bad-soft);cursor:not-allowed}
.opt.yes{border-color:var(--good);background:var(--good-soft)}
.opt:focus-visible{outline:2px solid var(--accent)}
.muted{color:var(--muted);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kpi{background:var(--head);border-radius:12px;padding:10px 12px}
.kpi b{display:block;font:700 22px var(--f-mono)}.kpi span{font-size:13px;color:var(--muted)}
.chart{display:flex;gap:4px;align-items:flex-end;height:120px;border-bottom:1px solid var(--line);padding-top:16px}
.chart div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:3px;min-width:0}
.chart i{display:block;width:100%;max-width:26px;background:var(--accent);border-radius:5px 5px 0 0}
.chart small{font:11px var(--f-mono);color:var(--muted)}
.days{display:flex;gap:4px}.days span{flex:1;text-align:center;font:10px var(--f-mono);color:var(--muted)}
table.t{border-collapse:collapse;width:100%;font-size:14px}
table.t th,table.t td{border-top:1px solid var(--line);padding:6px 8px;text-align:left}
table.t td.num,table.t th.num{text-align:right;font-family:var(--f-mono)}
.io textarea{width:100%;font:13px var(--f-mono);border:1px solid var(--line);border-radius:9px;padding:8px;background:var(--code);color:var(--ink);min-height:70px}
.modal{position:fixed;inset:0;background:var(--scrim);display:grid;place-items:center;padding:16px;z-index:20}
.modal .box{background:var(--panel);border-radius:18px;padding:24px;max-width:400px;width:100%;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.modal img{width:110px;height:110px}
.modal h3{margin:0;font-size:24px;font-weight:800}
#cf{position:fixed;inset:0;pointer-events:none;z-index:21}
/* AI tutor drawer (from Lò Luyện Hợp Nhất) */
.fab{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:max(16px,env(safe-area-inset-bottom));z-index:8;font:inherit;font-weight:700;border:0;border-radius:99px;padding:13px 18px;background:var(--accent);color:var(--accent-ink);box-shadow:0 6px 20px var(--shadow);cursor:pointer;display:inline-flex;gap:7px;align-items:center}
.ai{position:fixed;right:12px;top:12px;bottom:12px;width:min(440px,calc(100vw - 24px));z-index:9;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 40px var(--shadow);display:flex;flex-direction:column;overflow:hidden}
.aiHead{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line)}
.aiHead .sp{flex:1}.aiHead .ib{width:34px;height:34px;border:0}
.chip.sm{font-size:11px;padding:3px 7px;white-space:nowrap;max-width:150px;overflow:hidden;text-overflow:ellipsis}
.aiCfg{padding:12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px;background:var(--head);font-size:14px;overflow:auto;max-height:70%}
.aiCfg label{display:flex;gap:8px;align-items:flex-start}
.aiCfg .fld{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--muted)}
.aiCfg input[type=text],.aiCfg input[type=password],.aiCfg textarea,.aiProv select{width:100%;font:13px var(--f-mono);padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:var(--panel);color:var(--ink)}
.aiProvs{display:flex;flex-direction:column;gap:10px}
.aiProv{display:flex;flex-direction:column;gap:6px;padding:9px;border:1px solid var(--line);border-radius:9px;background:var(--panel)}
.aiProv .row{display:flex;gap:6px;align-items:flex-end}.aiProv .row .fld{flex:1}
.aiBar{display:flex;justify-content:flex-end;gap:6px;padding:0 12px 8px}
.aiPickW{position:relative;display:inline-flex}
.aiThink{font:12.5px var(--f-mono);color:var(--muted);background:var(--head);border:1px solid var(--line);border-radius:7px;padding:5px 10px;cursor:pointer}
.aiThink[aria-pressed=true]{color:var(--ink);border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.aiPickW::after{content:"▾";position:absolute;right:9px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--muted);font-size:11px}
.aiPickW select{appearance:none;-webkit-appearance:none;font:12.5px var(--f-mono);color:var(--ink);background:var(--head);border:1px solid var(--line);border-radius:7px;padding:5px 24px 5px 10px;max-width:240px;cursor:pointer}
.aiLog{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:94%;padding:9px 12px;border-radius:12px;font-size:15px;line-height:1.5;overflow-wrap:anywhere}
.msg.user{align-self:flex-end;background:var(--accent);color:var(--accent-ink);white-space:pre-wrap}
.msg.assistant{align-self:flex-start;background:var(--head)}
.msg p{margin:0 0 6px}.msg p:last-child{margin:0}.msg ul,.msg ol{margin:4px 0 6px;padding-left:20px}
.msg .mh{font-weight:800}.msg pre{font-size:13px;background:var(--code)}
.mdt{overflow-x:auto;margin:4px 0 8px}.mdt table{border-collapse:collapse;font-size:12.5px}.mdt td,.mdt th{border:1px solid var(--line);padding:3px 7px;white-space:nowrap}
.think{color:var(--muted);font-style:italic}
.aiEmpty{color:var(--muted);font-size:14px;display:flex;flex-direction:column;gap:6px}
.aiQuick{display:flex;gap:6px;overflow-x:auto;padding:8px 12px 0;flex-shrink:0}
.qk{font:inherit;font-size:13px;white-space:nowrap;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:99px;padding:6px 11px;cursor:pointer}
.aiForm{display:flex;gap:8px;padding:10px 12px;align-items:flex-end;flex-shrink:0}
.aiForm textarea{flex:1;min-width:0;resize:none;font:inherit;font-size:16px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);min-height:46px;max-height:140px}
.aiNote{font-size:13px;color:var(--bad);padding:0 12px 10px}
.aiForm .btn{box-shadow:none;padding:10px 14px}
</style>
</head><body>
<canvas id="cf"></canvas>
<div class="wrap">
  <header>
    <div class="brand"><h1>Lò Luyện <span>Python</span></h1></div>
    <div class="tools">
      <button class="ib" id="bVoice" aria-pressed="false" title="Bật/tắt giọng Elaina" aria-label="Bật/tắt giọng Elaina"></button>
      <button class="ib" id="bTheme" title="Đổi sáng/tối" aria-label="Đổi sáng/tối"></button>
    </div>
    <div class="stats">
      <div class="lvl"><b id="lvName">…</b><div class="bar"><i id="lvBar"></i></div><small id="lvTxt"></small></div>
      <span class="chip" id="xpChip"></span><span class="chip" id="stChip"></span>
    </div>
  </header>
  <div class="tabs" role="tablist">
    <button id="tLearn" class="on" role="tab">Học</button>
    <button id="tReview" role="tab">Ôn câu hay sai</button>
    <button id="tStats" role="tab">Tiến bộ</button>
  </div>
  <div class="hero"><img id="heroM" src="img/10.svg" alt="Elaina"><div class="bub" id="heroB" aria-live="polite">…</div></div>
  <div id="vLearn">
    <nav id="nav" aria-label="Chương"></nav>
    <div style="height:12px"></div>
    <div class="card" id="lesson"></div>
    <div style="height:14px"></div>
    <div class="card task" id="work"></div>
  </div>
  <div id="vReview" hidden><div class="card task" id="rev"></div></div>
  <div id="vStats" hidden></div>
</div>

<div class="modal" id="modal" hidden><div class="box" role="dialog" aria-modal="true">
  <img id="mImg" src="img/01.svg" alt=""><h3 id="mT"></h3><p id="mMsg" style="margin:0"></p>
  <div class="btns" style="justify-content:center"><button class="btn pri" id="mAgain">Làm lượt nữa</button><button class="btn" id="mBack">Về menu</button></div>
</div></div>

<button class="fab" id="aiFab" aria-controls="ai"></button>
<aside class="ai" id="ai" hidden aria-label="Gia sư AI">
  <div class="aiHead"><b>Gia sư Elaina</b><span class="chip sm" id="aiEng">…</span><span class="sp"></span>
    <button class="ib" id="aiSet" title="Cài đặt AI" aria-label="Cài đặt AI">⚙</button><button class="ib" id="aiClr" title="Xóa đoạn chat" aria-label="Xóa đoạn chat">🗑</button><button class="ib" id="aiX" title="Đóng" aria-label="Đóng">✕</button></div>
  <div class="aiCfg" id="aiCfg" hidden>
    <b>Chọn AI</b>
    <label><input type="radio" name="aiEngR" value="claude"><span><b>Claude có sẵn</b>: chỉ chạy khi mở app trên claude.ai, không cần key.</span></label>
    <label><input type="radio" name="aiEngR" value="api"><span><b>API riêng</b> (kiểu OpenAI, ví dụ xkiro qua proxy, hoặc Puter không cần key): chạy khi mở từ github.io.</span></label>
    <div id="aiProvs" class="aiProvs"></div>
    <button class="btn" id="aiAddP" type="button">+ Thêm nhà cung cấp</button>
    <span class="muted">Key chỉ lưu trong máy này, không nằm trong mã xuất tiến độ.</span>
    <div class="btns"><button class="btn pri" id="aiSave">Lưu</button><button class="btn" id="aiCancel">Đóng</button></div>
  </div>
  <div class="aiLog" id="aiLog" aria-live="polite"></div>
  <div class="aiQuick" id="aiQuick"></div>
  <form class="aiForm" id="aiForm"><textarea id="aiIn" rows="2" placeholder="Hỏi gì cũng được. Enter để gửi"></textarea><button class="btn pri" id="aiSend" type="submit">Gửi</button></form>
  <div class="aiBar" id="aiBar" hidden><label class="aiPickW" title="Đổi model"><select id="aiPick" aria-label="Chọn model"></select></label><button class="aiThink" id="aiThink" type="button" aria-pressed="false" title="Bật/tắt suy luận cho model này">🧠 Suy luận</button></div>
  <div class="aiNote" id="aiNote" hidden></div>
</aside>

<script>
const R=String.raw;
/* ================= NỘI DUNG =================
 Mỗi chương {id, t, theory(html), tasks:[...]}. id cố định, đừng đổi (tiến độ lưu theo id).
 Bài code: {id,k:"code",ask(html),start,test,hint,sol,why}
   test = Python chạy sau code người học, cùng namespace; có sẵn _out (chuỗi đã print) và _src (code người học). Dùng assert ..., "lời nhắc tiếng Việt".
 Bài trắc nghiệm: {id,k:"mcq",ask,code?,o:[...],a:index,why}
 pkgs: ["pandas"] nếu bài cần gói ngoài. */
const L=[
{id:"c1",t:"Bắt đầu: kiểu dữ liệu & biến",theory:`
<p>Python chạy từng dòng từ trên xuống. <code>print(...)</code> in ra màn hình, cách nhau bằng dấu phẩy thì in cách một khoảng.</p>
<ul>
<li><b>Số nguyên</b> <code>int</code>: <code>150_000_000</code> (dấu <code>_</code> chỉ để dễ đọc). Lũy thừa dùng <code>**</code>: <code>2 ** 10</code>. Python chịu được số cực lớn.</li>
<li><b>Số thực</b> <code>float</code>: <code>0.1</code>, <code>1.2 + 2.3</code>.</li>
<li><b>Chuỗi</b> <code>str</code>: trong <code>"..."</code> hoặc <code>'...'</code>. Cộng chuỗi là nối: <code>"TK" + "111"</code>; nhân chuỗi là lặp: <code>"=" * 40</code>. <code>\\n</code> xuống dòng, <code>\\t</code> tab. Chuỗi nhiều dòng dùng <code>"""..."""</code>.</li>
<li><code>len(x)</code> đếm độ dài chuỗi, list…</li>
<li><b>list</b> <code>[...]</code> sửa được; <b>tuple</b> <code>(...)</code> khai rồi là cố định; <b>dict</b> <code>{"ma": "KH01"}</code> cặp khóa–giá trị; <b>set</b> <code>{1, 2, 2}</code> tự bỏ trùng.</li>
<li><code>True</code>/<code>False</code> là kiểu đúng/sai; <code>None</code> nghĩa là "không có gì".</li>
</ul>
<p><b>Biến</b> là cái tên gắn vào giá trị: <code>doanh_thu = 150_000_000</code>. Gán lại thì tên đó trỏ sang giá trị mới, kiểu gì cũng được.</p>
<p><b>Bẫy hay gặp:</b> Python không cho cộng số với chuỗi: <code>5 + "2"</code> báo <code>TypeError</code>. Phải đổi kiểu trước: <code>int("2")</code> ra số, <code>str(5)</code> ra chuỗi. Mẹo đếm chữ số: <code>len(str(12345))</code> → 5.</p>`,

{id:"c2",t:"Hàm: def, phạm vi biến, lambda",theory:`
<p>Hàm gói một phép tính để gọi lại nhiều lần:</p>
<pre><code>def tien_hang(so_luong, don_gia):
    return so_luong * don_gia</code></pre>
<ul>
<li>Thân hàm <b>thụt vào 4 dấu cách</b> sau dấu <code>:</code>. <code>return</code> trả kết quả ra ngoài; không có <code>return</code> thì hàm trả <code>None</code>.</li>
<li>Hàm gọi được trong biểu thức và gọi lồng nhau: <code>tien_hang(2, 5) + tien_hang(1, 3)</code>, và hàm mới có thể dùng hàm cũ.</li>
<li><b>Tham số mặc định</b>: <code>def tien_thue(tien, thue_suat=0.1)</code>; không truyền thì lấy 0.1. Gọi theo tên cũng được: <code>tien_thue(thue_suat=0.08, tien=500)</code>.</li>
<li><b>Hàm cũng là giá trị</b>: gán được <code>f = tien_thue</code>, truyền được vào hàm khác.</li>
<li><b>lambda</b> là hàm một dòng không tên: <code>cong_thue = lambda x: x * 1.1</code>.</li>
<li><b>Method</b> là hàm gắn với đối tượng: <code>"kh01".upper()</code> → <code>"KH01"</code>; <code>.strip()</code> bỏ khoảng trắng hai đầu.</li>
</ul>
<p><b>Phạm vi biến:</b> biến gán bên trong hàm (kể cả tham số) là <b>cục bộ</b>, gán gì cũng không đụng biến cùng tên ở ngoài. Hàm <b>đọc</b> được biến toàn cục, nhưng muốn <b>sửa</b> thì phải khai <code>global ten_bien</code> ở đầu hàm, không thì dính <code>UnboundLocalError</code>.</p>`,

{id:"c3",t:"Điều kiện: so sánh, and/or, if/elif",theory:`
<p>So sánh ra <code>True</code>/<code>False</code>: <code>==</code> bằng, <code>!=</code> khác, <code>&lt; &gt; &lt;= &gt;=</code>. Viết dây được: <code>0 &lt;= thue_suat &lt;= 0.1</code>. Chuỗi so theo thứ tự từ điển.</p>
<ul>
<li><code>a and b</code> đúng khi cả hai đúng; <code>a or b</code> đúng khi một trong hai đúng; <code>not a</code> đảo ngược.</li>
<li><code>%</code> là chia lấy dư: <code>x % 2 == 0</code> nghĩa là số chẵn.</li>
</ul>
<pre><code>if so_ngay &lt;= 30:
    nhom = "Trong hạn"
elif so_ngay &lt;= 90:
    nhom = "Quá hạn"
else:
    nhom = "Khó đòi"</code></pre>
<p>Python xét từ trên xuống, gặp điều kiện đúng đầu tiên là chạy nhánh đó rồi <b>bỏ qua hết phần còn lại</b>. Nên xếp điều kiện hẹp trước, rộng sau. Nhánh nào cũng phải thụt lề đều nhau.</p>`,
tasks:[
{id:"c3t1",k:"mcq",ask:"In ra gì?",code:R`x = 5
print(2 < x < 10 and x % 2 == 0)`,o:["True","False","5","Báo lỗi"],a:1,why:"<code>2 &lt; 5 &lt; 10</code> đúng, nhưng 5 lẻ nên vế sau sai; <code>and</code> cần cả hai → False."},

`,

    assert phan_loai_no(n) == kq, f"phan_loai_no({n}) phải ra {kq!r}, mày ra {phan_loai_no(n)!r}."`,

{id:"c3t3",k:"code",ask:"Trích dự phòng nợ phải thu theo số <b>tháng</b> quá hạn: dưới 6 tháng 0%; 6 đến dưới 12 tháng 30%; 12 đến dưới 24 tháng 50%; 24 đến dưới 36 tháng 70%; từ 36 tháng 100%. Viết <code>du_phong(so_no, thang)</code> trả số tiền cần trích.",
start:R`def du_phong(so_no, thang):
    pass
`,
test:R`cases = [(100, 0, 0), (100, 5, 0), (100, 6, 30), (100, 11, 30), (100, 12, 50), (100, 24, 70), (100, 35, 70), (100, 36, 100), (200, 50, 200)]
for no, t, kq in cases:
    v = du_phong(no, t)
    assert v is not None and abs(v - kq) < 1e-9, f"du_phong({no}, {t}) phải ra {kq}, mày ra {v}."`,
hint:"Xét từ mốc nhỏ lên: <code>if thang &lt; 6</code> → tỷ lệ 0, <code>elif thang &lt; 12</code> → 0.3… cuối cùng nhân <code>so_no * ty_le</code>.",
sol:R`def du_phong(so_no, thang):
    if thang < 6:
        ty_le = 0
    elif thang < 12:
        ty_le = 0.3
    elif thang < 24:
        ty_le = 0.5
    elif thang < 36:
        ty_le = 0.7
    else:
        ty_le = 1
    return so_no * ty_le`,why:"Mỗi <code>elif</code> chỉ được xét khi các nhánh trên sai, nên chỉ cần ghi mốc trên."},
{id:"c3t4",k:"code",ask:"Viết <code>hop_le(so_luong, don_gia, thue_suat)</code>: trả <code>True</code> chỉ khi số lượng và đơn giá <b>không âm</b> và thuế suất nằm trong <b>0 đến 10%</b> (0 đến 0.1).",
start:R`def hop_le(so_luong, don_gia, thue_suat):
    pass
`,
test:R`assert hop_le(10, 200_000, 0.1) is True, "Số liệu bình thường phải hợp lệ."
assert hop_le(0, 0, 0) is True, "Số 0 vẫn hợp lệ (không âm)."
assert hop_le(-1, 200_000, 0.1) is False, "Số lượng âm là không hợp lệ."
assert hop_le(10, -5, 0.1) is False, "Đơn giá âm là không hợp lệ."
assert hop_le(10, 200_000, 0.12) is False, "Thuế suất 12% vượt 10%."

{id:"c4",t:"List và vòng lặp for",theory:`
<p>List giữ nhiều giá trị theo thứ tự, rất hợp để lưu doanh thu từng tháng hoặc các khoản trên sổ. Vị trí đầu tiên là chỉ số 0; chỉ số âm đếm từ cuối. Dùng <code>for</code> để đọc lần lượt, hoặc <code>sum(ds)</code> khi chỉ cần cộng.</p>
<ul>
<li>Đọc và sửa phần tử bằng chỉ số: <code>doanh_thu[0]</code> là tháng đầu, <code>doanh_thu[-1]</code> là tháng cuối; gán <code>doanh_thu[0] = 120</code>.</li>
<li>Cắt lát có dạng <code>ds[dau:cuoi:buoc]</code>; điểm cuối không lấy: <code>ds[1:3]</code> lấy chỉ số 1 và 2, còn <code>ds[::-1]</code> đảo thứ tự.</li>
<li><code>append(x)</code> thêm một giá trị ở cuối; <code>x in ds</code> kiểm tra đã có chưa; <code>len(ds)</code> đếm số phần tử.</li>
<li><code>for tien in ds</code> lấy từng khoản; <code>range(1, 4)</code> sinh 1, 2, 3 vì điểm cuối cũng không lấy.</li>
<li><code>zip(ma, tien)</code> ghép các phần tử cùng vị trí; <code>sorted(ds, key=len)</code> sắp theo độ dài tên.</li>
</ul>
<pre><code>doanh_thu = [120, 90, 150]
cong_don = 0
luy_ke = []
for tien in doanh_thu:
    cong_don += tien
    luy_ke.append(cong_don)
print(luy_ke)  # [120, 210, 360]</code></pre>
<p><b>Bẫy hay gặp:</b> <code>append</code> sửa list tại chỗ và trả về <code>None</code>, đừng viết <code>ds = ds.append(x)</code>. Với lát cắt, nhớ điểm cuối bị loại; <code>ds[:2]</code> chỉ gồm hai phần tử đầu.</p>`,tasks:[
{id:"c4t1",k:"code",ask:"Viết hàm <code>tong_12_thang(ds)</code> nhận list doanh thu theo tháng và trả về tổng các khoản. Ví dụ <code>tong_12_thang([10, 20, 30])</code> → <code>60</code>.",start:R`def tong_12_thang(ds):
    pass`,test:R`assert "tong_12_thang" in globals(), "Chưa có hàm tong_12_thang."
assert tong_12_thang([10]*12)==120, "Tổng 12 tháng sai."`,hint:"Dùng sum.",sol:R`def tong_12_thang(ds):
    return sum(ds)`,why:"Sum cộng các phần tử."},
{id:"c4t2",k:"code",ask:"Viết hàm <code>cumulative_sum(ds)</code> nhận list tiền theo thứ tự tháng và trả list tổng lũy kế. Ví dụ <code>cumulative_sum([100, 200, 50])</code> → <code>[100, 300, 350]</code>.",start:R`def cumulative_sum(ds):
    pass`,test:R`assert "cumulative_sum" in globals(), "Chưa có hàm cumulative_sum."
assert cumulative_sum([100,200,50])==[100,300,350], "Lũy kế sai."`,hint:"Lặp, cộng dồn rồi append.",sol:R`def cumulative_sum(ds):
    kq=[]
    tong=0

        kq.append(tong)

{id:"c4t3",k:"code",ask:"Viết hàm <code>ma_duy_nhat(ds)</code> nhận list mã khách hàng và trả list đã bỏ mã trùng, vẫn giữ thứ tự xuất hiện đầu tiên. Ví dụ <code>ma_duy_nhat([\"KH01\", \"KH02\", \"KH01\"])</code> → <code>[\"KH01\", \"KH02\"]</code>.",start:R`def ma_duy_nhat(ds):
    pass`,test:R`assert "ma_duy_nhat" in globals(), "Chưa có hàm ma_duy_nhat."
assert ma_duy_nhat(["KH01","KH02","KH01"])==["KH01","KH02"], "Mã trùng chưa bỏ."`,hint:"Chỉ append nếu chưa có.",sol:R`def ma_duy_nhat(ds):

{id:"c4t4",k:"code",ask:"Viết hàm <code>dups(ds)</code> nhận list mã khách hàng và trả list các mã xuất hiện hơn một lần. Ví dụ <code>dups([\"KH01\", \"KH02\", \"KH01\"])</code> phải chứa <code>\"KH01\"</code>.",start:R`def dups(ds):

assert set(dups(["KH01","KH02","KH01"]))=={"KH01"}, "Tìm mã bị lặp."`,hint:"Theo dõi mã đã thấy.",sol:R`def dups(ds):
    seen=set(); lap=set()
    for x in ds:

        seen.add(x)
    return list(lap)`,why:"Set theo dõi phần tử đã gặp."},
{id:"c4t5",k:"code",ask:"Viết hàm <code>chia_nhom(ds, kich_thuoc)</code> nhận list và số phần tử mỗi nhóm, trả list các nhóm; nhóm cuối có thể ngắn hơn. Ví dụ <code>chia_nhom([1, 2, 3, 4, 5], 2)</code> → <code>[[1, 2], [3, 4], [5]]</code>.",start:R`def chia_nhom(ds, kich_thuoc):

{id:"c5",t:"Tuple, set và chuỗi",theory:`
<p>Tuple, set và chuỗi giúp xử lý dữ liệu sổ sách theo từng cấu trúc. Tuple giữ thứ tự nhưng không sửa được sau khi tạo; set chỉ giữ giá trị duy nhất; chuỗi có các method để làm sạch và tách dữ liệu.</p>
<ul>
<li>Tuple dùng dấu phẩy để gom giá trị; tuple một phần tử phải có dấu phẩy: <code>(1,)</code>. Gán tách (unpacking) như <code>ma, tien = (\"111\", 500)</code>.</li>
<li>Set loại phần tử trùng: <code>set([\"KH01\", \"KH01\"])</code> còn một mã. Thêm bằng <code>add</code>: <code>ma.add(\"KH02\")</code>.</li>
<li>Chuỗi cũng có thể cắt lát: <code>ma[:2]</code> lấy hai ký tự đầu; <code>strip()</code> bỏ trắng ở hai đầu.</li>
<li><code>split(\";\")</code> tách dòng thành trường; <code>\";\".join(ds)</code> nối các trường bằng dấu chấm phẩy.</li>
<li>F-string chèn giá trị và định dạng số: <code>f\"{tien:,.0f}\"</code> hiển thị số tiền có dấu phẩy hàng nghìn.</li>
</ul>
<pre><code>dong = \"KH01; Nguyen Van A; 1500000\"
ma, ten, tien = dong.split(\";\")
ma = ma.strip()
ten = ten.strip()
tien = int(tien)
print((ma, ten, tien))  # ('KH01', 'Nguyen Van A', 1500000)</code></pre>
<p><b>Bẫy hay gặp:</b> <code>(1)</code> chỉ là số nguyên trong ngoặc; phải viết <code>(1,)</code> mới là tuple. Set không bảo đảm thứ tự, vì vậy nếu cần giữ thứ tự mã xuất hiện thì dùng list và kiểm tra <code>in</code>.</p>`,tasks:[
{id:"c5t1",k:"code",ask:"Viết hàm <code>tach_dong(dong)</code> nhận một dòng gồm mã, tên, số dư ngăn bằng dấu chấm phẩy; trả tuple gồm mã, tên và số dư dạng số nguyên. Ví dụ <code>tach_dong(\"KH01;Nguyen Van A;1500000\")</code> → <code>(\"KH01\", \"Nguyen Van A\", 1500000)</code>.",start:R`def tach_dong(dong):
    pass`,test:R`assert "tach_dong" in globals(), "Chưa có hàm tach_dong."
assert tach_dong("KH01;Nguyen Van A;1500000")==("KH01","Nguyen Van A",1500000), "Tách dòng sai."`,hint:"Split rồi unpack.",sol:R`def tach_dong(dong):
    ma,ten,du=dong.strip().split(";")
    return ma,ten,int(du)`,why:"Split tạo trường, dấu phẩy trả tuple."},
{id:"c5t2",k:"code",ask:"Viết hàm <code>ma_set(ds)</code> nhận list mã khách hàng và trả về một set không còn mã trùng. Ví dụ <code>ma_set([\"KH01\", \"KH01\", \"KH02\"])</code> → <code>{\"KH01\", \"KH02\"}</code>.",start:R`def ma_set(ds):
    pass`,test:R`assert "ma_set" in globals(), "Chưa có hàm ma_set."
assert ma_set(["KH01","KH01","KH02"])=={"KH01","KH02"}, "Set chưa khử trùng."`,hint:"Đổi list sang set.",sol:R`def ma_set(ds):
    return set(ds)`,why:"Set chỉ chứa giá trị duy nhất."},
{id:"c5t3",k:"code",ask:"Viết hàm <code>sap_file(ds)</code> nhận list tên file và trả list mới sắp theo phần mở rộng. Ví dụ <code>sap_file([\"a.txt\", \"b.csv\"])</code> → <code>[\"b.csv\", \"a.txt\"]</code>.",start:R`def sap_file(ds):
    pass`,test:R`assert "sap_file" in globals(), "Chưa có hàm sap_file."
assert sap_file(["a.txt","b.csv"])==["b.csv","a.txt"], "Sắp theo đuôi file."`,hint:"Lấy phần sau dấu chấm.",sol:R`def sap_file(ds):
    return sorted(ds,key=lambda x:x.rsplit(".",1)[-1])`,why:"Key là phần mở rộng."},
{id:"c5t4",k:"code",ask:"Viết hàm <code>dong_tien(ma, x)</code> nhận mã khách hàng và số tiền, trả chuỗi có dấu phẩy phân cách hàng nghìn. Ví dụ <code>dong_tien(\"KH01\", 1500000)</code> → <code>\"KH01: 1,500,000 đồng\"</code>.",start:R`def dong_tien(ma,x):
    pass`,test:R`assert "dong_tien" in globals(), "Chưa có hàm dong_tien."
assert dong_tien("KH01",1500000)=="KH01: 1,500,000 đồng", "Định dạng tiền sai."`,hint:"F-string dùng :,.0f.",sol:R`def dong_tien(ma,x):
    return f"{ma}: {x:,.0f} đồng"`,why:"Định dạng nhóm hàng nghìn."},
{id:"c5t5",k:"mcq",ask:"In ra gì? Dấu phẩy sau một giá trị quyết định đó là tuple hay số nguyên.",code:R`so = (1)
print(type(so).__name__)`,o:["int","tuple","list","set"],a:0,why:"Ngoặc đơn chỉ gom biểu thức, nên <code>(1)</code> vẫn là <code>int</code>. Tuple một phần tử cần dấu phẩy: <code>(1,)</code>."},
{id:"c5t6",k:"code",ask:"Viết hàm <code>chuan_ma(s)</code> nhận chuỗi mã ngăn bằng dấu phẩy, bỏ khoảng trắng và mã trùng nhưng giữ thứ tự đầu tiên; trả list mã. Ví dụ <code>chuan_ma(\" KH01,KH02, KH01\")</code> → <code>[\"KH01\", \"KH02\"]</code>.",start:R`def chuan_ma(s):
    pass`,test:R`assert "chuan_ma" in globals(), "Chưa có hàm chuan_ma."
assert chuan_ma(" KH01,KH02, KH01")==["KH01","KH02"], "Chuẩn hóa mã sai."`,hint:"Lặp kết quả split, strip và kiểm tra in.",sol:R`def chuan_ma(s):
    k=[]
    for x in s.split(","):
        x=x.strip()
        if x and x not in k: k.append(x)
    return k`,why:"Strip làm sạch, membership giữ duy nhất."}]},
{id:"c6",t:"Làm việc với file",theory:`
<p>File giúp chương trình đọc bút toán đã lưu hoặc ghi báo cáo ra đĩa. Mở bằng <code>open</code>; nên dùng <code>with</code> để file được đóng tự động kể cả khi có lỗi. Chỉ định <code>encoding=\"utf-8\"</code> để đọc tiếng Việt ổn định.</p>
<ul>
<li>Chế độ <code>\"r\"</code> đọc file có sẵn; <code>\"w\"</code> tạo mới hoặc ghi đè; <code>\"a\"</code> ghi nối vào cuối.</li>
<li><code>read()</code> trả toàn bộ nội dung dạng chuỗi; <code>readlines()</code> trả list các dòng, thường mỗi dòng còn ký tự xuống dòng.</li>
<li><code>write(chuoi)</code> ghi chuỗi; <code>writelines(ds)</code> ghi từng chuỗi nhưng không tự thêm xuống dòng.</li>
<li><code>len(noi_dung)</code> đếm ký tự; <code>noi_dung.split()</code> tách từ theo khoảng trắng; <code>lines[:n]</code> lấy n dòng đầu.</li>
<li>Muốn trả dòng sạch, dùng <code>strip()</code>; để đảo thứ tự list có thể dùng <code>lines[::-1]</code>.</li>
</ul>
<pre><code>with open(\"doanh_thu.txt\", \"w\", encoding=\"utf-8\") as f:
    f.write(\"120\\n90\\n150\\n\")
with open(\"doanh_thu.txt\", encoding=\"utf-8\") as f:
    doanh_thu = [int(dong) for dong in f.readlines()]
print(sum(doanh_thu))  # 360</code></pre>
<p><b>Bẫy hay gặp:</b> <code>w</code> xóa nội dung cũ trước khi ghi; dùng <code>a</code> nếu cần nối tiếp. <code>writelines</code> không tự chèn ký tự xuống dòng, còn <code>readlines()</code> thường giữ <code>\\n</code> ở cuối từng dòng.</p>`,tasks:[
{id:"c6t1",k:"code",ask:"Viết hàm <code>doc_file(ten)</code> nhận tên đường dẫn và trả toàn bộ nội dung file dưới dạng chuỗi. Bài kiểm tra tạo file có nội dung <code>KH01</code>; ví dụ gọi <code>doc_file(\"fixture.txt\")</code> → <code>\"KH01\"</code>.",start:R`with open("fixture.txt","w",encoding="utf-8") as f: f.write("KH01")
def doc_file(ten):
    pass`,test:R`with open("fixture.txt","w",encoding="utf-8") as f: f.write("KH01")
assert "doc_file" in globals(), "Chưa có hàm doc_file."
assert doc_file("fixture.txt")=="KH01", "Đọc file sai."`,hint:"Mở r rồi read.",sol:R`with open("fixture.txt","w",encoding="utf-8") as f: f.write("KH01")
def doc_file(ten):
    with open(ten,encoding="utf-8") as f: return f.read()`,why:"Read trả toàn bộ nội dung."},
{id:"c6t2",k:"code",ask:"Viết hàm <code>ghi_dong(ten, ds)</code> ghi từng chuỗi trong list thành một dòng file, có ký tự xuống dòng sau mỗi mục. Ví dụ với list <code>[\"111\", \"131\"]</code>, file phải có đúng hai dòng: <code>111</code> và <code>131</code>.",start:R`def ghi_dong(ten,ds):

{id:"c7",t:"List comprehension, map, filter, enumerate",theory:`
<p>List comprehension tạo list mới gọn từ list bút toán. Cấu trúc là <code>[biểu_thức for phần_tử in dữ_liệu]</code>, có thể thêm điều kiện lọc ở cuối; dữ liệu gốc không bị sửa.</p>
<ul>
<li>Biến đổi từng phần tử: <code>[x * 1.1 for x in ds]</code> cộng thuế 10%.</li>
<li>Lọc khoản dương: <code>[x for x in ds if x &gt; 0]</code>; điều kiện đặt sau <code>for</code>.</li>
<li>Kết hợp lọc và tính: <code>[x * 1.1 for x in ds if x &gt; 0]</code>.</li>
<li><code>map(f, ds)</code> áp dụng hàm lên từng phần tử; Python 3 trả iterator nên thường bọc bằng <code>list(...)</code>.</li>
<li><code>enumerate(ds, start=1)</code> ghép số thứ tự; <code>zip(ma, tien)</code> ghép dữ liệu cùng vị trí.</li>
</ul>
<pre><code>but_toan = [{\"tk\": \"111\", \"so_tien\": 100},
            {\"tk\": \"131\", \"so_tien\": 250}]
so_tien = [b[\"so_tien\"] for b in but_toan if b[\"so_tien\"] &gt; 100]
print(so_tien)  # [250]</code></pre>
<p><b>Bẫy hay gặp:</b> <code>if</code> lọc đặt sau <code>for</code>; dạng <code>[x if dieu_kien for x in ds]</code> sai cú pháp. Muốn chọn giữa hai giá trị, dùng <code>a if dieu_kien else b</code> ở phần biểu thức.</p>`,tasks:[
{id:"c7t1",k:"code",ask:"Viết hàm <code>loc_hd(ds)</code> nhận list hóa đơn có khóa <code>tong</code>, trả list những hóa đơn trên 1.000.000. Ví dụ <code>loc_hd([{\"tong\": 100}, {\"tong\": 1200000}])</code> trả list chỉ chứa hóa đơn thứ hai.",start:R`def loc_hd(ds):
    pass`,test:R`assert "loc_hd" in globals(), "Chưa có hàm loc_hd."
h=[{"tong":100},{"tong":1200000}]
assert loc_hd(h)==[h[1]], "Lọc hóa đơn sai."`,hint:"Comprehension với điều kiện.",sol:R`def loc_hd(ds):
    return [x for x in ds if x["tong"]>1000000]`,why:"Điều kiện giữ hóa đơn lớn."},
{id:"c7t2",k:"code",ask:"Viết <code>cong_thue(ds, thue)</code> trả về list mới, mỗi số tiền đã cộng thuế. Ví dụ <code>cong_thue([100, 200], 0.1)</code> → <code>[110, 220]</code>. Dùng list comprehension.",start:R`def cong_thue(ds,thue):
    pass`,test:R`assert "cong_thue" in globals(), "Chưa có hàm cong_thue."
assert all(abs(a-b)<1e-6 for a,b in zip(cong_thue([100,200],0.1),[110,220])), "Tính thuế list sai."`,hint:"Tạo list mới.",sol:R`def cong_thue(ds,thue):

{id:"c8",t:"Dictionary",theory:`
<p>Dictionary (dict) ánh xạ một khóa, như mã tài khoản, tới một giá trị như số dư. Khóa phải duy nhất; tra cứu bằng <code>d[ma]</code>, cập nhật bằng phép gán. Dùng <code>get</code> khi khóa có thể chưa tồn tại.</p>
<ul>
<li><code>d.get(k, mac_dinh)</code> trả giá trị đang có hoặc giá trị mặc định mà không thêm khóa: <code>so_du.get(\"111\", 0)</code>.</li>
<li><code>d.setdefault(k, mac_dinh)</code> trả giá trị hiện có; nếu thiếu thì thêm khóa với mặc định. Ví dụ <code>d.setdefault(\"131\", [])</code> lấy hoặc tạo list để gom giao dịch.</li>
<li><code>d[k] = v</code> thêm/cập nhật; <code>del d[k]</code> xóa khóa. <code>keys()</code>, <code>values()</code>, <code>items()</code> cho khóa, giá trị, hoặc cặp.</li>
<li>Lặp cặp bằng <code>for ma, tien in d.items()</code>; đếm số lần bằng cách cập nhật <code>d[ma] = d.get(ma, 0) + 1</code>.</li>
<li><code>sorted(d.items(), key=lambda cap: cap[1], reverse=True)</code> sắp theo giá trị giảm dần.</li>
</ul>
<pre><code>but_toan = [(\"111\", 100), (\"131\", 250), (\"111\", 50)]
so_du = {}
for ma, tien in but_toan:
    so_du[ma] = so_du.get(ma, 0) + tien
print(so_du)  # {'111': 150, '131': 250}</code></pre>
<p><b>Bẫy hay gặp:</b> <code>get</code> chỉ đọc và trả mặc định, không tạo khóa. <code>setdefault</code> có tác dụng phụ là thêm khóa khi thiếu; nếu mặc định là lời gọi hàm như <code>setdefault(k, tao_list())</code>, lời gọi vẫn chạy trước cả khi biết khóa đã có.</p>`,tasks:[
{id:"c8t1",k:"code",ask:"Mỗi bút toán là dict <code>{\"tk\": ..., \"so_tien\": ...}</code>. Viết <code>tong_tk(ds)</code> trả dict tổng tiền theo tài khoản. Ví dụ <code>tong_tk([{\"tk\": \"111\", \"so_tien\": 10}, {\"tk\": \"111\", \"so_tien\": 5}])</code> → <code>{\"111\": 15}</code>.",start:R`def tong_tk(ds):
    pass`,test:R`assert "tong_tk" in globals(), "Chưa có hàm tong_tk."
d=[{"tk":"111","so_tien":10},{"tk":"111","so_tien":5}]
assert tong_tk(d)=={"111":15}, "Cộng theo tài khoản sai."`,hint:"Dict get cộng dồn.",sol:R`def tong_tk(ds):
    k={}
    for b in ds: k[b["tk"]]=k.get(b["tk"],0)+b["so_tien"]
    return k`,why:"Get trả số dư hiện có hoặc 0."},
{id:"c8t2",k:"code",ask:"Mỗi hóa đơn là dict có khóa <code>\"ma_kh\"</code>. Viết <code>dem_hd(ds)</code> trả dict đếm số hóa đơn của từng khách. Ví dụ <code>dem_hd([{\"ma_kh\": \"KH01\"}, {\"ma_kh\": \"KH01\"}])</code> → <code>{\"KH01\": 2}</code>.",start:R`def dem_hd(ds):
    pass`,test:R`assert "dem_hd" in globals(), "Chưa có hàm dem_hd."
assert dem_hd([{"ma_kh":"KH01"},{"ma_kh":"KH01"}])=={"KH01":2}, "Đếm hóa đơn sai."`,hint:"Tăng bộ đếm mã khách.",sol:R`def dem_hd(ds):
    d={}
    for x in ds:
        m=x["ma_kh"]; d[m]=d.get(m,0)+1
    return d`,why:"Mỗi dòng tăng bộ đếm khách."},
{id:"c8t3",k:"code",ask:"Viết <code>sap_dem(d)</code> nhận dict đếm, trả list các khóa xếp theo số đếm <b>giảm dần</b>. Ví dụ <code>sap_dem({\"a\": 2, \"b\": 5})</code> → <code>[\"b\", \"a\"]</code>.",start:R`def sap_dem(d):
    pass`,test:R`assert "sap_dem" in globals(), "Chưa có hàm sap_dem."
assert sap_dem({"a":2,"b":5})==["b","a"], "Sắp số đếm sai."`,hint:"Sort items theo value reverse.",sol:R`def sap_dem(d):
    return [k for k,v in sorted(d.items(),key=lambda x:x[1],reverse=True)]`,why:"Sắp theo giá trị giảm dần."},
{id:"c8t4",k:"code",ask:"Viết <code>gom_anagram(ds)</code> gom các từ có cùng bộ chữ cái (đảo chữ) vào chung một list, trả list các nhóm. Ví dụ <code>gom_anagram([\"eat\", \"tea\", \"tan\"])</code> → <code>[[\"eat\", \"tea\"], [\"tan\"]]</code> (thứ tự nhóm không quan trọng).",start:R`def gom_anagram(ds):
    pass`,test:R`assert "gom_anagram" in globals(), "Chưa có hàm gom_anagram."
assert sorted(sorted(x) for x in gom_anagram(["eat","tea","tan"]))==[["eat","tea"],["tan"]], "Gom anagram sai."`,hint:"Khóa là chuỗi sorted(tu).",sol:R`def gom_anagram(ds):
    d={}
    for x in ds: d.setdefault("".join(sorted(x)),[]).append(x)
    return list(d.values())`,why:"Từ cùng chữ có cùng khóa đã sắp."},
{id:"c8t5",k:"mcq",ask:"In ra gì? <code>get</code> chỉ đọc dict; <code>setdefault</code> thêm khóa thiếu nhưng đối số mặc định vẫn được tính trước khi gọi.",code:R`def tao_mac_dinh():

{id:"c8t6",k:"code",ask:"Mỗi phần tử là cặp <code>(ma_kh, so_tien)</code>. Viết <code>tong_no(ds)</code> trả dict tổng nợ theo mã khách. Ví dụ <code>tong_no([(\"KH01\", 10), (\"KH01\", 5)])</code> → <code>{\"KH01\": 15}</code>.",start:R`def tong_no(ds):
    pass`,test:R`assert "tong_no" in globals(), "Chưa có hàm tong_no."
assert tong_no([("KH01",10),("KH01",5)])=={"KH01":15}, "Tổng nợ sai."`,hint:"Unpack từng cặp.",sol:R`def tong_no(ds):
    d={}
    for ma,tien in ds: d[ma]=d.get(ma,0)+tien
    return d`,why:"Gộp các khoản theo mã."}]},
{id:"c9",t:"Module: os, re, json",theory:`
<p>Module <code>os</code> hỗ trợ thao tác đường dẫn, <code>re</code> tìm mẫu văn bản bằng biểu thức chính quy, còn <code>json</code> chuyển dữ liệu Python sang JSON và ngược lại. Import module trước khi gọi hàm của nó.</p>
<ul>
<li><code>os.path.splitext(ten)</code> tách tên và phần mở rộng; ví dụ <code>os.path.splitext(\"bao_cao.csv\")[1]</code> là <code>\".csv\"</code>.</li>
<li><code>os.path.join(thu_muc, ten)</code> ghép đường dẫn; <code>os.makedirs(thu_muc, exist_ok=True)</code> tạo thư mục nếu cần.</li>
<li><code>re.findall(mau, s)</code> trả đoạn khớp; <code>re.sub(mau, thay, s)</code> thay đoạn; <code>re.fullmatch</code> yêu cầu toàn chuỗi khớp.</li>
<li>Mẫu <code>r\"\\d+\"</code> tìm cụm chữ số; <code>r\"(?:03|05|07|08|09)\\d{8}\"</code> khớp số điện thoại 10 số với đầu số này.</li>
<li><code>json.dumps(d)</code> tạo chuỗi JSON; <code>json.loads(s)</code> phân tích chuỗi thành dữ liệu Python.</li>
</ul>
<pre><code>import json
but_toan = {\"ma\": \"HD01\", \"so_tien\": 1500000}
chuoi = json.dumps(but_toan, ensure_ascii=False)
doc_lai = json.loads(chuoi)
print(doc_lai[\"so_tien\"])  # 1500000</code></pre>
<p><b>Bẫy hay gặp:</b> <code>findall(r\"\\d+\", ...)</code> trả cụm số dạng chuỗi, không phải số nguyên. <code>fullmatch</code> kiểm tra toàn chuỗi, còn <code>search</code> chỉ cần thấy một đoạn khớp.</p>`,tasks:[

{id:"c10",t:"Lập trình hướng đối tượng và ngoại lệ",theory:`
<p>Lớp gom dữ liệu và hành vi liên quan thành một kiểu đối tượng; ví dụ mỗi hóa đơn giữ số lượng, đơn giá và thuế suất, rồi tự tính tổng. Khi gọi <code>HoaDon(...)</code>, Python tạo đối tượng và chạy <code>__init__</code>.</p>
<ul>
<li>Tham số đầu của method thường là <code>self</code>, tham chiếu tới đối tượng hiện tại. Gán <code>self.so_du = so_du</code> lưu thuộc tính vào đối tượng.</li>
<li>Method định nghĩa phép làm với dữ liệu: <code>def tong(self): return self.tien_hang * (1 + self.vat)</code>.</li>
<li>Kế thừa tạo lớp chuyên biệt từ lớp cha; <code>super().__init__(so_du)</code> gọi phần khởi tạo của cha.</li>
<li><code>__str__</code> quyết định chuỗi hiển thị của đối tượng; <code>__add__</code> định nghĩa hành vi phép cộng như <code>a + b</code>.</li>
<li><code>raise ValueError(\"...\")</code> báo dữ liệu không hợp lệ; <code>try/except ValueError</code> bắt lỗi đó để xử lý.</li>
</ul>
<pre><code>class HoaDon:
    def __init__(self, so_luong, don_gia, vat):
        if so_luong &lt; 0 or don_gia &lt; 0:
            raise ValueError(\"Số liệu âm\")
        self.tien_hang = so_luong * don_gia
        self.vat = vat
    def tong(self):
        return self.tien_hang * (1 + self.vat)
hd = HoaDon(2, 100, 0.1)
print(hd.tong())  # 220.00000000000003</code></pre>

import sys, io, json, traceback
def _input(prompt=""):
    raise RuntimeError("__INPUT__")
def _run(code, test):
    res = {"out": "", "etype": "", "emsg": "", "line": 0, "tb": "", "pass": None, "tmsg": ""}
    ns = {"__name__": "__main__", "input": _input}
    buf = io.StringIO(); old = sys.stdout; sys.stdout = buf
    out = ""
    try:
        try:
            exec(compile(code, "<bai_lam>", "exec"), ns)
        except BaseException as e:
            res["etype"] = type(e).__name__
            res["emsg"] = str(e)
            if isinstance(e, SyntaxError):
                res["line"] = e.lineno or 0
                res["emsg"] = e.msg
            else:
                fr = [f for f in traceback.extract_tb(e.__traceback__) if f.filename == "<bai_lam>"]
                if fr: res["line"] = fr[-1].lineno
            ls = traceback.format_exception(type(e), e, e.__traceback__)
            res["tb"] = "".join(l for l in ls if '"<exec>"' not in l and 'File "/lib' not in l)[-1500:]
        out = buf.getvalue()
        if test and not res["etype"]:
            ns["_out"] = out
            ns["_src"] = code
            try:
                exec(compile(test, "<test>", "exec"), ns)
                res["pass"] = True
            except AssertionError as e:
                res["pass"] = False
                res["tmsg"] = str(e) or "Kết quả chưa đúng."
            except BaseException as e:
                res["pass"] = False
                res["tmsg"] = type(e).__name__ + ": " + str(e)
        elif test:
            res["pass"] = False
    finally:
        sys.stdout = old
    res["out"] = (out or buf.getvalue())[-6000:]
    return json.dumps(res, ensure_ascii=False)

let W=null,wReady=null,seq=0,pend={};
function killW(){if(W)W.terminate();W=null;wReady=null;const ps=pend;pend={};Object.values(ps).forEach(f=>f({etype:"TimeoutError",emsg:""}))}
function getW(){
  if(wReady)return wReady;
  W=new Worker(URL.createObjectURL(new Blob([WSRC],{type:"text/javascript"})));
  wReady=new Promise((ok,no)=>{
    W.onmessage=e=>{const m=e.data;if(m.ready)return ok(W);if(m.fail){killW();return no(m.fail)}const f=pend[m.id];if(f){delete pend[m.id];f(m.res)}};
    W.onerror=ev=>{killW();no(ev.message||"worker")};
  });
  W.postMessage({boot:HARNESS,url:PYO});return wReady;
}
let pyLoaded=false;
async function runPy(code,test,pkgs,onStage){
  if(!pyLoaded)onStage&&onStage("Đang tải Python lần đầu (~10MB), đợi chút…");
  try{await getW()}catch(e){return {fatal:"load"}}
  pyLoaded=true;onStage&&onStage(pkgs&&pkgs.length?"Đang nạp "+pkgs.join(", ")+"…":"Đang chạy…");
  const id=++seq;
  return new Promise(ok=>{
    const tm=setTimeout(()=>{if(pend[id]){delete pend[id];killW();ok({etype:"TimeoutError",emsg:""})}},(pkgs&&pkgs.length?60:10)*1000);
    pend[id]=r=>{clearTimeout(tm);ok(r)};W.postMessage({id,code,test,pkgs:pkgs||[]});
  });
}

let view="learn",li=0,ti=0,rq=[],ri=0;
let st={};const resetSt=()=>{st={wrong:false,hint:false,ans:false,solved:false,last:null,mcqNo:new Set()}};resetSt();
const curT=()=>view==="review"?BYID[rq[ri]]:L[li].tasks[ti];
function gain(){
  const t=curT();let xp=st.ans?5:(st.wrong||st.hint)?15:20,add=0;
  if(P.done[t.id]==null){P.done[t.id]=xp;add=xp}
  else if(xp>P.done[t.id]){add=xp-P.done[t.id];P.done[t.id]=xp}
  if(add){P.xp+=add;const d=today();P.xplog[d]=(P.xplog[d]||0)+add}
  if(!st.wrong&&!st.hint&&!st.ans){P.streak++;if(P.streak>P.best)P.best=P.streak}else P.streak=0;
  if(view==="review"&&P.wrong[t.id]!=null){P.wrong[t.id]--;if(P.wrong[t.id]<=0)delete P.wrong[t.id]}
  save();renderStats();if(P.streak&&P.streak%5===0)confetti();
  return add;
}
function miss(kind){
  const t=curT();
  if(!st.wrong){st.wrong=true;P.wrong[t.id]=2;P.streak=0;P.errlog.push({d:today(),t:kind});if(P.errlog.length>400)P.errlog=P.errlog.slice(-400);save();renderStats()}
}
function fb(box,kind,html,stamp){box.className="fb "+kind;box.innerHTML=html;box.hidden=false;if(stamp)box.dataset.stamp=stamp;else delete box.dataset.stamp}

function md(src){
  const inl=t=>esc(t).replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>");
  const isRow=x=>/^\s*\|.*\|\s*$/.test(x),isSep=x=>/^\s*\|[\s:|-]+\|\s*$/.test(x);
  const isUl=x=>/^\s*[-*•]\s+/.test(x),isOl=x=>/^\s*\d+[.)]\s+/.test(x),isH=x=>/^#{1,4}\s+/.test(x),isF=x=>/^\s*```/.test(x);
  const ls=String(src).split("\n");let h="",i=0;
  while(i<ls.length){const ln=ls[i];
    if(isF(ln)){i++;const b=[];while(i<ls.length&&!isF(ls[i]))b.push(ls[i++]);i++;h+=`<pre><code>${esc(b.join("\n"))}</code></pre>`;continue}
    if(isRow(ln)){const rows=[];while(i<ls.length&&isRow(ls[i]))rows.push(ls[i++]);
      const head=rows.length>1&&isSep(rows[1]),cells=r=>r.trim().replace(/^\||\|$/g,"").split("|").map(c=>c.trim());
      h+=`<div class="mdt"><table>${rows.filter(r=>!isSep(r)).map((r,k)=>`<tr>${cells(r).map(c=>head&&k===0?`<th>${inl(c)}</th>`:`<td>${inl(c)}</td>`).join("")}</tr>`).join("")}</table></div>`;continue}
    if(isUl(ln)){h+="<ul>";while(i<ls.length&&isUl(ls[i]))h+=`<li>${inl(ls[i++].replace(/^\s*[-*•]\s+/,""))}</li>`;h+="</ul>";continue}
    if(isOl(ln)){h+="<ol>";while(i<ls.length&&isOl(ls[i]))h+=`<li>${inl(ls[i++].replace(/^\s*\d+[.)]\s+/,""))}</li>`;h+="</ol>";continue}
    if(isH(ln)){h+=`<p class="mh">${inl(ln.replace(/^#{1,4}\s+/,""))}</p>`;i++;continue}
    if(!ln.trim()){i++;continue}
    const p=[inl(ls[i++])];while(i<ls.length&&ls[i].trim()&&!isRow(ls[i])&&!isUl(ls[i])&&!isOl(ls[i])&&!isH(ls[i])&&!isF(ls[i]))p.push(inl(ls[i++]));
    h+=`<p>${p.join("<br>")}</p>`;
  }
  return h;
}
function renderNav(){

function mountTask(box,t,steps){
  resetSt();box.innerHTML=taskHtml(t,steps);
  if(t.k==="code"){
    const ta=box.querySelector("#code");ta.value=DRAFT[t.id]!=null?DRAFT[t.id]:t.start;
    ta.oninput=()=>{DRAFT[t.id]=ta.value;saveDraft()};
    ta.onkeydown=e=>{
      if(e.key==="Tab"&&!e.shiftKey){e.preventDefault();ins(ta,"    ")}
      else if(e.key==="Enter"&&!e.isComposing){e.preventDefault();const s=ta.value.slice(0,ta.selectionStart),line=s.slice(s.lastIndexOf("\n")+1);
        let ind=(line.match(/^ */)||[""])[0];if(/:\s*$/.test(line))ind+="    ";ins(ta,"\n"+ind)}
    };
    box.querySelector(".keys").onclick=e=>{const b=e.target.closest("button");if(!b)return;const v=KEYS[+b.dataset.k][1];ins(ta,v);
      if(/[)\]"]$/.test(v)&&v.length>1&&!/ $/.test(v)){ta.selectionStart=ta.selectionEnd=ta.selectionStart-1}ta.focus()};
    box.querySelector("#bRun").onclick=()=>doRun(box,t,false);
    box.querySelector("#bSub").onclick=()=>doRun(box,t,true);

  }else{

      if(j===t.a){st.solved=true;b.classList.add("yes");box.querySelectorAll(".opt").forEach(x=>x.disabled=true);const add=gain();
        fb(f,"good",`${pick(SAY.good)} ${add?`+${add} XP`:""}<span class="why">${t.why}</span>`,"Đúng!");say(pick(SAY.good),"happy");showNext(box)}
      else{st.mcqNo.add(j);b.classList.add("no");miss("Trắc nghiệm sai");fb(f,"bad",pick(SAY.bad),"Sai!");say(pick(SAY.bad),"sad")}};

function ins(ta,v){const a=ta.selectionStart,b=ta.selectionEnd;ta.setRangeText(v,a,b,"end");ta.dispatchEvent(new Event("input"))}

async function doRun(box,t,grade){
  if(st.solved&&grade)return;
  const code=box.querySelector("#code").value,out=box.querySelector("#out"),f=box.querySelector("#fb");
  const bs=[box.querySelector("#bRun"),box.querySelector("#bSub")];bs.forEach(b=>b.disabled=true);
  out.hidden=false;out.innerHTML=`<span class="lab">Kết quả</span>`;
  const r=await runPy(code,grade?t.test:"",t.pkgs,s=>{out.innerHTML=`<span class="lab">${esc(s)}</span>`});
  bs.forEach(b=>b.disabled=false);
  st.last={code,r};
  out.innerHTML=`<span class="lab">Kết quả in ra</span>${r.out?esc(r.out):'<span class="muted">(không in gì)</span>'}`;
  if(r.fatal||r.etype){
    if(grade&&!r.fatal)miss(r.etype);
    fb(f,"bad",errHtml(r)+(r.tb?`<pre><code>${esc(r.tb)}</code></pre>`:"")+`<div class="btns" style="margin-top:6px"><button class="btn" id="bAskErr">${ic("chat")}Hỏi gia sư về lỗi này</button></div>`,grade?"Sai!":"");
    f.querySelector("#bAskErr").onclick=()=>askErr(t,code,r);
    if(grade)say(pick(SAY.bad),"sad");return;
  }
  if(!grade){f.hidden=true;return}
  if(r.pass){st.solved=true;const add=gain();fb(f,"good",`${pick(SAY.good)} ${add?`+${add} XP`:""}${t.why?`<span class="why">${t.why}</span>`:""}`,"Đúng!");say(pick(SAY.good),"happy");showNext(box)}
  else{miss("Sai kết quả");fb(f,"bad",`<b>Chưa qua test:</b> ${esc(r.tmsg)}<div class="btns" style="margin-top:6px"><button class="btn" id="bAskErr">${ic("chat")}Hỏi gia sư</button></div>`,"Sai!");
    f.querySelector("#bAskErr").onclick=()=>askErr(t,code,r);say(pick(SAY.bad),"sad")}
}

/* ---------- Confetti ---------- */
function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const c=$("cf"),x=c.getContext("2d"),cs=getComputedStyle(document.documentElement);c.width=innerWidth;c.height=innerHeight;
  const cols=["--cf1","--cf2","--cf3","--cf4","--cf5"].map(k=>cs.getPropertyValue(k).trim());
  const ps=Array.from({length:140},()=>({x:innerWidth/2,y:innerHeight/2,vx:(Math.random()-.5)*16,vy:-Math.random()*14-4,s:Math.random()*6+4,c:cols[Math.random()*5|0],r:Math.random()*6}));
  let f=0;(function tick(){x.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.vy+=.4;p.x+=p.vx;p.y+=p.vy;p.r+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});
    if(++f<120)requestAnimationFrame(tick);else x.clearRect(0,0,c.width,c.height)})();
